apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: telemt
  namespace: shturval-cd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: telemt
  source:
    repoURL: https://github.com/vutratenko/telemt-k8s.git
    targetRevision: main
    path: deploy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
