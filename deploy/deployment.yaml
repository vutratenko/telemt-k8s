apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemt
  labels:
    app.kubernetes.io/name: telemt
    app.kubernetes.io/part-of: telemt-k8s
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: telemt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telemt
        app.kubernetes.io/part-of: telemt-k8s
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: config-init
          image: alpine:3.19
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -euo pipefail
              if [ -z "${TELEMT_SECRET:-}" ]; then
                echo "ERROR: TELEMT_SECRET is empty"
                exit 1
              fi
              if [ "${#TELEMT_SECRET}" -ne 32 ]; then
                echo "ERROR: TELEMT_SECRET must be exactly 32 hex characters"
                exit 1
              fi
              TELEMT_SECRET_ESC=$(printf '%s' "$TELEMT_SECRET" | sed 's/[[\.*^$()+?{|]/\\&/g')
              sed "s|\${TELEMT_SECRET}|${TELEMT_SECRET_ESC}|g" \
                /config-template/telemt.toml.template > /config/telemt.toml
              echo "Config written to /config/telemt.toml"
          env:
            - name: TELEMT_SECRET
              valueFrom:
                secretKeyRef:
                  name: telemt-secrets
                  key: telemt-secret
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config-template
              mountPath: /config-template
              readOnly: true
            - name: config-work
              mountPath: /config
      containers:
        - name: telemt
          image: ghcr.io/telemt/telemt:latest
          imagePullPolicy: IfNotPresent
          args:
            - /etc/telemt/telemt.toml
          ports:
            - name: mtproxy
              containerPort: 8443
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: RUST_LOG
              value: info
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config-work
              mountPath: /etc/telemt
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config-template
          configMap:
            name: telemt-config
        - name: config-work
          emptyDir:
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            sizeLimit: 4Mi
